<section class="projects">
    <div class="projects__header">
        <h1 class="projects__title">Projects</h1>
        <p class="projects__subtitle">Things I've built</p>
    </div>

    <div class="projects__filters">
        <label class="projects__toggle">
            <input
                type="checkbox"
                [ngModel]="showFeatured()"
                (ngModelChange)="showFeatured.set($event); onFilterChange()"
            >
            <span class="projects__toggle-slider"></span>
            <span class="projects__toggle-label">Featured Only</span>
        </label>

        <label class="projects__toggle">
            <input
                type="checkbox"
                [ngModel]="showPublished()"
                (ngModelChange)="showPublished.set($event); onFilterChange()"
            >
            <span class="projects__toggle-slider"></span>
            <span class="projects__toggle-label">Published</span>
        </label>
    </div>

    @if (isLoading()) {
        <div class="projects__loading">
            <p>Loading projects...</p>
        </div>
    }

    @if (error()) {
        <div class="projects__error">
            <p>{{ error() }}</p>
        </div>
    }

    @if (!isLoading() && !error() && projects().length === 0) {
        <div class="projects__empty">
            <p>No projects found.</p>
        </div>
    }

    @if (!isLoading() && projects().length > 0) {
        <div class="projects__grid">
            @for (project of projects(); track project._id) {
                <app-project-card [project]="project" />
            }
        </div>
    }
</section>
